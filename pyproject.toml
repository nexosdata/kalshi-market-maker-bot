[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-market-maker-bot"
version = "1.0.0"
description = "Institutional Avellaneda-Stoikov Market Making Engine & CFTC Fee Optimizer for Kalshi Prediction Markets"
readme = "README.md"
authors = [
    { name = "NaxosData Quant Engineering", email = "research@naxosdata.com" },
    { name = "William Gonda", email = "william@naxosdata.com" }
]
license = { text = "MIT" }
keywords = [
    "kalshi market maker bot",
    "kalshi trading bot",
    "cftc prediction market algorithm",
    "avellaneda stoikov kalshi",
    "kalshi automated liquidity",
    "prediction-markets",
    "market-making",
    "order-flow-imbalance",
    "cftc-rule-40-2",
    "quantitative-finance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
kalshi-mm = "kalshi_mm.cli:main"
kalshi-market-maker = "kalshi_mm.cli:main"

[project.urls]
Homepage = "https://naxosdata.com"
Documentation = "https://github.com/nexosdata/kalshi-market-maker-bot"
Repository = "https://github.com/nexosdata/kalshi-market-maker-bot"
Tracker = "https://github.com/nexosdata/kalshi-market-maker-bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_mm*"]
